<section id="contact" class="contact">
  <div class="container">
    <h2 class="section-title"><i class="fa-solid fa-envelope"></i> Get In Touch</h2>
    <div class="contact-content">
      <div class="contact-info">
        <h3>Let's build something great together</h3>
        <p>
          I'm open to full-stack, ML, and applied AI opportunities. Whether you have a question,
          a project in mind, or just want to connect — my inbox is always open.
        </p>

        <div class="contact-details">
          <a class="contact-item" [href]="'mailto:' + profile.email">
            <i class="fa-solid fa-envelope contact-icon"></i>
            <span>{{ profile.email }}</span>
          </a>
          <div class="contact-item">
            <i class="fa-solid fa-location-dot contact-icon"></i>
            <span>{{ profile.location }}</span>
          </div>
        </div>

        <div class="social-links contact-social">
          <a [href]="profile.github" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-github"></i>
          </a>
          <a [href]="profile.linkedin" target="_blank" rel="noopener noreferrer">
            <i class="fa-brands fa-linkedin"></i>
          </a>
        </div>
      </div>

      <form class="contact-form" (ngSubmit)="submit($event)">
        <div class="form-group">
          <input type="text" name="name" placeholder="Your Name" [(ngModel)]="name" required />
        </div>
        <div class="form-group">
          <input type="email" name="email" placeholder="Your Email" [(ngModel)]="email" required />
        </div>
        <div class="form-group">
          <textarea name="message" rows="5" placeholder="Your Message" [(ngModel)]="message" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-paper-plane"></i> Send Message
        </button>
      </form>
    </div>
  </div>
</section>
