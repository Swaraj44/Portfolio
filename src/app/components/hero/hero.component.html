<section id="home" class="hero">
  <div class="hero-content">
    <div class="hero-text">
      <h1 class="hero-title">
        Hi, I'm <span class="highlight">{{ profile.name }}</span>
      </h1>
      <p class="hero-subtitle">{{ profile.role }}</p>
      <p class="hero-description">{{ profile.tagline }}</p>

      <div class="hero-buttons">
        <button class="btn btn-primary" (click)="goTo('projects')">
          <i class="fa-solid fa-rocket"></i> View My Work
        </button>
        <button class="btn btn-secondary" (click)="goTo('contact')">
          <i class="fa-solid fa-envelope"></i> Get In Touch
        </button>
        <a class="btn btn-outline" [href]="profile.resumeUrl" download>
          <i class="fa-solid fa-download"></i> Download CV
        </a>
      </div>

      <div class="social-links">
        <a [href]="profile.github" target="_blank" rel="noopener noreferrer">
          <i class="fa-brands fa-github"></i>
        </a>
        <a [href]="profile.linkedin" target="_blank" rel="noopener noreferrer">
          <i class="fa-brands fa-linkedin"></i>
        </a>
      </div>
    </div>

    <div class="hero-image">
      <div class="profile-image">
        <img [src]="profile.photo" [alt]="profile.name" />
      </div>
    </div>
  </div>

  <div class="scroll-indicator">
    <i class="fa-solid fa-chevron-down scroll-icon"></i>
  </div>
</section>
