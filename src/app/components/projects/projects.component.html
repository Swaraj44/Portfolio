<section id="projects" class="projects">
  <div class="container">
    <h2 class="section-title"><i class="fa-solid fa-rocket"></i> Featured Projects</h2>
    <div class="projects-grid">
      @for (project of projects; track project.title) {
        <article class="project-card">
          <div class="project-image">
            <img [src]="project.image" [alt]="project.title" />
            <div class="project-overlay">
              <i class="fa-solid fa-up-right-from-square"></i>
            </div>
          </div>
          <div class="project-content">
            <h3>{{ project.title }}</h3>
            <p>{{ project.description }}</p>
            <div class="project-tech">
              @for (tech of project.tech; track tech) {
                <span>{{ tech }}</span>
              }
            </div>
            <div class="project-links">
              @if (project.githubUrl) {
                <a class="project-link" [href]="project.githubUrl" target="_blank" rel="noopener noreferrer">
                  <i class="fa-brands fa-github"></i> GitHub
                </a>
              }
              @if (project.demoUrl) {
                <a class="project-link" [href]="project.demoUrl" target="_blank" rel="noopener noreferrer">
                  <i class="fa-solid fa-up-right-from-square"></i> Live Demo
                </a>
              }
            </div>
          </div>
        </article>
      }
    </div>
  </div>
</section>
